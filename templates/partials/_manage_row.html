{% load static %}
<tr id="row-{{ p.id }}">
  <td data-label="ID">{{ p.id }}</td>
  <td data-label="Product">
    <div class="cell-media">
      {% if p.image %}
        <img class="table-thumb" src="{{ p.image.url }}" alt="" loading="lazy" width="44" height="44">
      {% else %}
        <img class="table-thumb" src="{% static 'img/placeholder.svg' %}" alt="" loading="lazy" width="44" height="44">
      {% endif %}
      <div>
        <a class="table-title" href="{% url 'product_detail' p.id %}">{{ p.name }}</a>
        {% if not p.is_active %}<span class="muted">Hidden from store</span>{% endif %}
      </div>
    </div>
  </td>
  <td data-label="Category"><span class="chip">{{ p.category.name }}</span></td>
  <td data-label="Price" class="num">₱{{ p.price|floatformat:"2g" }}</td>
  <td data-label="Stock">
    <span>
      <input type="number" name="stock" class="qty" value="{{ attempted|default:p.stock }}"
             aria-label="Stock for {{ p.name }}"
             hx-post="{% url 'product_stock' p.id %}" hx-trigger="change"
             hx-target="closest tr" hx-swap="outerHTML">
      {% if row_error %}<small class="error" role="alert">{{ row_error }}</small>{% endif %}
    </span>
  </td>
  <td data-label="Status">
    <button type="button" class="pill {% if p.is_active %}on{% else %}off{% endif %}"
            hx-post="{% url 'product_toggle' p.id %}" hx-target="closest tr" hx-swap="outerHTML"
            title="Click to toggle">{% if p.is_active %}Active{% else %}Inactive{% endif %}</button>
  </td>
  <td data-label="Actions" class="text-right">
    <div class="table-actions">
      <a class="btn btn-sm btn-light" href="{% url 'product_edit' p.id %}">Edit</a>
      <button type="button" class="btn btn-sm btn-danger"
              hx-delete="{% url 'product_delete' p.id %}"
              hx-confirm="Delete “{{ p.name }}”? This cannot be undone."
              hx-target="closest tr" hx-swap="outerHTML">Delete</button>
    </div>
  </td>
</tr>
