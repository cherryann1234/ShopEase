<div class="empty">
  <div class="empty-icon" aria-hidden="true">
    {% if icon == 'cart' %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/></svg>
    {% elif icon == 'box' %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 8.5 12 11l4.5-2.5"/><path d="M12 11v9"/><path d="m21 9-9 6-9-6"/><path d="m3 9 9-6 9 6v7.5a2 2 0 0 1-1.1 1.8L12 21l-7.9-3.7A2 2 0 0 1 3 15.5Z"/></svg>
    {% elif icon == 'search' %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
    {% elif icon == 'list' %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    {% else %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/><path d="M9 6h6"/><path d="M9 10h6"/><path d="M9 14h3"/><path d="m10 19-3-3 3-3"/></svg>
    {% endif %}
  </div>
  <h2>{{ heading }}</h2>
  <p>{{ message }}</p>
  {% if cta_url %}<a class="btn" href="{{ cta_url }}">{{ cta_label|default:"Continue" }}</a>{% endif %}
</div>
